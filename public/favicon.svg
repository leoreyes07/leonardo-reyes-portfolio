<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48dada" />
      <stop offset="100%" stop-color="#8083ff" />
    </linearGradient>
  </defs>
  <!-- Background matches surface color -->
  <rect width="100" height="100" rx="25" fill="#09112d" />
  
  <!-- Left Bracket < -->
  <path d="M 35 30 L 15 50 L 35 70" fill="none" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Bracket > -->
  <path d="M 65 30 L 85 50 L 65 70" fill="none" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Slash / -->
  <path d="M 55 20 L 45 80" fill="none" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" />
</svg>
